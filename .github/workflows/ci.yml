name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, reopened, synchronize]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/gradle-setup

      - name: Export Keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -di > ./keystore.jks
        shell: bash
        env:
          API_KEY: ${{ secrets.KEYSTORE }}


      - name: Export NCP_KEY_ID
        run: |
          echo NCP_KEY_ID=\"$NCP_KEY_ID\" > local.properties
        shell: bash
        env:
          API_KEY: ${{ secrets.NCP_KEY_ID }}

      - name: Export KAKAO_KEY
        run: |
          echo KAKAO_KEY=\"$KAKAO_KEY\" > local.properties
        shell: bash
        env:
          API_KEY: ${{ secrets.KAKAO_KEY }}

      - name: Export FACEBOOK_APP_ID
        run: |
          echo FACEBOOK_APP_ID=\"$FACEBOOK_APP_ID\" > local.properties
        shell: bash
        env:
          API_KEY: ${{ secrets.FACEBOOK_APP_ID }}

      - name: Export KEYSTORE_FILE
        run: |
          echo KEYSTORE_FILE=\"$KEYSTORE_FILE\" > local.properties
        shell: bash
        env:
          API_KEY: ${{ secrets.KEYSTORE_FILE }}

      - name: Export KEYSTORE_PASSWORD
        run: |
          echo KEYSTORE_PASSWORD=\"$KEYSTORE_PASSWORD\" > local.properties
        shell: bash
        env:
          API_KEY: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Export KEY_ALIAS
        run: |
          echo KEY_ALIAS=\"$KEY_ALIAS\" > local.properties
        shell: bash
        env:
          API_KEY: ${{ secrets.KEY_ALIAS }}

      - name: Export KEY_PASSWORD
        run: |
          echo KEY_PASSWORD=\"$KEY_PASSWORD\" > local.properties
        shell: bash
        env:
          API_KEY: ${{ secrets.KEY_PASSWORD }}

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Upload ktlint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-report
          path: '**/build/reports/ktlint/**'
          retention-days: 7

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: '**/build/reports/detekt/**'
          retention-days: 7

      - name: Upload Android Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: '**/build/reports/lint-results-debug.xml'
          retention-days: 7
